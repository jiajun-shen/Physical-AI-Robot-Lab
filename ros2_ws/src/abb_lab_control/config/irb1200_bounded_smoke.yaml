schema_version: 1
scope: SIMULATION_ONLY

joint_order:
  - joint_1
  - joint_2
  - joint_3
  - joint_4
  - joint_5
  - joint_6

neutral_reference:
  joint_1: 0.0
  joint_2: 0.0
  joint_3: 0.0
  joint_4: 0.0
  joint_5: 0.0
  joint_6: 0.0

target:
  joint_1: 0.05
  joint_2: -0.05
  joint_3: 0.04
