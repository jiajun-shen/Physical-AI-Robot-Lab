schema_version: 1
scope: SIMULATION_ONLY

robot:
  group_name: manipulator
  planning_frame: world
  tcp_link: drawing_tip
  arm_joint_names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
  gripper_joint: two_finger_right_joint
  velocity_limits_rad_per_sec:
    joint_1: 5.027
    joint_2: 4.189
    joint_3: 5.236
    joint_4: 6.981
    joint_5: 7.069
    joint_6: 10.472

planner:
  pipeline_id: ompl
  planner_id: RRTConnectkConfigDefault
  planning_attempts: 3
  allowed_planning_time_sec: 5.0
  velocity_scaling: 0.12
  position_tolerance_m: 0.008
  orientation_tolerance_rad: 0.08
  retime_safety_factor: 2.0
  minimum_segment_duration_sec: 0.20
  service_wait_timeout_sec: 25.0
  service_call_timeout_sec: 18.0
  action_result_timeout_sec: 75.0
  endpoint_observation_timeout_sec: 10.0
  endpoint_samples: 3
  observed_joint_tolerance_rad: 0.040
  vision_timeout_sec: 18.0
  cartesian_max_step_m: 0.008
  cartesian_jump_threshold: 0.0
  cartesian_prismatic_jump_threshold: 0.0
  cartesian_revolute_jump_threshold: 0.0
  cartesian_acceleration_scaling: 0.10
  # Two successive generated samples per execution command keep the physical
  # controller inside its verified 0.03-rad goal tolerance at the heart's
  # high-curvature lobes. Adjacent segments share an endpoint, preserving a
  # continuous board-local curve rather than switching to joint waypoints.
  cartesian_segment_waypoints: 2
  # Cartesian traces are deliberately slower than the free-space approach:
  # there are no verified acceleration limits, and every chunk must be
  # visibly tracked by the Gazebo joint controller.
  # The simulated arm's position loop needs a visibly settled command at the
  # heart lobe reversals.  These are runtime scheduling limits, not invented
  # acceleration limits: every segment is still checked against the reviewed
  # velocity limits and independently observed after execution.
  cartesian_velocity_scaling: 0.03
  cartesian_retime_safety_factor: 4.0
  cartesian_minimum_segment_duration_sec: 0.50
  # MoveIt can return several collision-free approach IK branches for the
  # same pen pose.  Sample a bounded number before motion and retain only a
  # branch whose whole segmented Cartesian route also passes collision checks.
  orientation_route_preflight_attempts: 8

# The board center comes live from the RGB-D vision stream.  These values are
# only its calibrated local axes/dimensions in the static lab, never authored
# curve positions in world coordinates.
board:
  size_xyz_m: [0.03, 0.70, 0.45]
  robot_facing_normal_world: [-1.0, 0.0, 0.0]
  horizontal_axis_world: [0.0, 1.0, 0.0]
  vertical_axis_world: [0.0, 0.0, 1.0]
  front_surface_offset_m: 0.015
  # `drawing_tip` belongs to the collision-bearing P6 pen model.  The tip
  # remains 8 mm in front of the solid board to keep this simulation trace
  # contactless while its actual tool frame maps to the board plane.
  virtual_tip_standoff_m: 0.008
  approach_offset_m: 0.100
  horizontal_half_extent_m: 0.35
  vertical_half_extent_m: 0.225
  curve_samples: 31
  minimum_tcp_trace_samples: 5
  orientation_candidates:
    - id: x_plus_roll_90
      xyzw: [0.70710678, 0.0, 0.0, 0.70710678]
    - id: x_plus_roll_0
      xyzw: [0.0, 0.0, 0.0, 1.0]
    - id: x_plus_roll_180
      xyzw: [1.0, 0.0, 0.0, 0.0]
    - id: x_plus_roll_270
      xyzw: [-0.70710678, 0.0, 0.0, 0.70710678]
    - id: x_minus_roll_0
      xyzw: [0.0, 1.0, 0.0, 0.0]
    - id: p5_side_calibrated
      xyzw: [0.65328148, 0.65328148, -0.27059805, 0.27059805]

scene:
  table:
    id: p6_work_table
    center_xyz_m: [0.65, 0.0, 0.375]
    size_xyz_m: [1.0, 0.9, 0.75]
  ball_radius_m: 0.035
  cube_size_m: 0.060
