controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Keep the established six-axis arm trajectory interface separate from
    # the one-joint gripper action interface.
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    two_finger_gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      # Keep the reviewed 0.03-rad endpoint precision.  The Gazebo position
      # interface uses a documented proportional position loop, so a bounded
      # extra second lets high-curvature Phase-6 pen segments settle without
      # accepting a looser final joint error.
      goal_time: 3.0
      stopped_velocity_tolerance: 0.05
      joint_1: {trajectory: 0.1, goal: 0.03}
      joint_2: {trajectory: 0.1, goal: 0.03}
      joint_3: {trajectory: 0.1, goal: 0.03}
      joint_4: {trajectory: 0.1, goal: 0.03}
      joint_5: {trajectory: 0.1, goal: 0.03}
      joint_6: {trajectory: 0.1, goal: 0.03}

two_finger_gripper_controller:
  ros__parameters:
    # In Jazzy this controller creates ~/gripper_cmd, resolving to
    # /two_finger_gripper_controller/gripper_cmd for this controller name.
    joint: two_finger_right_joint
    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 20.0
    goal_tolerance: 0.002
    allow_stalling: false
    stall_velocity_threshold: 0.0005
    stall_timeout: 1.0
    # This profile has only a position command interface. Zero avoids
    # representing a simulated contact force as an available force command.
    max_effort: 0.0
    max_velocity: 0.040
